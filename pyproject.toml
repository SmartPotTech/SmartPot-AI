[project]
name = "smartpot-ai"
version = "1.0.0"
description = "Servicio de IA de SmartPot: sistema experto, lógica difusa, modelos de ML y agente reactivo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic-settings>=2.11",
    "numpy>=2.3",
    "scikit-learn>=1.7",
    "cython>=3.0",
    "setuptools>=84.2.1",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
